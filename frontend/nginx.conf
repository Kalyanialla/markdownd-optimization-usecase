upstream backend_api {
    server markdown-optimizer-backend:9124;
}

server {
    listen 9123;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Client body limit
    client_max_body_size 20M;

    # API proxies for direct port 9123 access
    location /markdown-optimizer/api/v1/ {
        proxy_pass http://backend_api/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /markdown-optimizer/api/ {
        proxy_pass http://backend_api/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api/v1/ {
        proxy_pass http://backend_api/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static assets under /markdown-optimizer/assets/
    location /markdown-optimizer/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Support /markdown-optimizer/ application base path
    location /markdown-optimizer/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /markdown-optimizer/index.html;
    }

    # Root redirect
    location = / {
        return 301 /markdown-optimizer/;
    }

    # Static assets caching with dual path fallback
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri /markdown-optimizer$uri =404;
    }
}
