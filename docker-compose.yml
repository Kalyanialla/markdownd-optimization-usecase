services:
  markdown-optimizer-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: markdown-optimizer-backend
    restart: unless-stopped
    ports:
      - "9124:9124"
    environment:
      APP_ENV: production
      DEBUG: "False"
      API_V1_PREFIX: /api/v1
      AWS_REGION: us-east-1
      AWS_SECRET_NAME: Markdown-Intelligence-Console
      FRONTEND_ORIGIN: http://localhost
    networks:
      - dispute-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  markdown-optimizer-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: markdown-optimizer-frontend
    restart: unless-stopped
    ports:
      - "9123:9123"
    networks:
      - dispute-network
    depends_on:
      - markdown-optimizer-backend

networks:
  dispute-network:
    name: dispute-chargeback_default
    external: true
