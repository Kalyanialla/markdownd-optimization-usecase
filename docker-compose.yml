services:
  markdown-optimizer-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: markdown-optimizer-backend
    restart: unless-stopped
    expose:
      - "9124"
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DEBUG=${DEBUG:-False}
      - API_V1_PREFIX=${API_V1_PREFIX:-/api/v1}
      - AWS_SECRET_NAME=${AWS_SECRET_NAME:-Markdown-Intelligence-Console}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://postgres:Dhani2710@uptodate_db:5432/markdown_optimization_db}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost}
    networks:
      - markdown-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  markdown-optimizer-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: markdown-optimizer-frontend
    restart: unless-stopped
    expose:
      - "9123"
    networks:
      - markdown-network
    depends_on:
      - markdown-optimizer-backend

networks:
  markdown-network:
    name: dispute-chargeback_default
    external: true
