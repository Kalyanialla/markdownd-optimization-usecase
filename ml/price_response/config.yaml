model_name: "price_response_estimation"
model_version: "1.0.0"
random_seed: 20241018

target_column: "target_units_sold"
price_features:
  - "selling_price"
  - "discount_pct"
  - "price_ratio_to_regular"
  - "price_ratio_to_cost"
  - "planned_margin_pct"
  - "price_difference_to_competitor"

baseline_type: "ridge_price_response_regression"
candidate_type: "xgboost_price_response"

hyperparameters:
  n_estimators: 350
  max_depth: 5
  learning_rate: 0.05
  subsample: 0.85
  colsample_bytree: 0.80
  reg_lambda: 5.0
  n_jobs: -1
