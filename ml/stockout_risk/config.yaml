model_name: "seven_day_stockout_risk_classifier"
model_version: "1.0.0"
random_seed: 20241018

data_paths:
  train: "data/processed/train.csv"
  validation: "data/processed/validation.csv"
  test: "data/processed/test.csv"
  cleaned_canonical: "data/processed/markdown_optimization_cleaned.csv"
  artifacts_dir: "ml/artifacts/model3"
  reports_dir: "data/reports/model3_stockout_risk"

target:
  name: "stockout_within_next_7_days"
  horizon_days: 7
  censoring_handling: "Drop observations where <7 future days remain AND no stockout occurred"

baseline:
  type: "deterministic_inventory_runout_rule"
  condition: "(opening_stock_units + inbound_units) < (7.0 * sales_rolling_mean_7d)"

xgboost_params:
  n_estimators: 300
  max_depth: 5
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  scale_pos_weight: 3.0
  eval_metric: "logloss"
  random_state: 20241018
  n_jobs: -1
